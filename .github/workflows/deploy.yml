name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Stamp game version
        run: printf 'window.CATCH_THE_FOOD_VERSION = "1.0.%s";\n' "$GITHUB_RUN_NUMBER" > catch-the-food/version.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: catch-the-food

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
